<!DOCTYPE html>
 <html lang="es">
     <head> 
        <meta charset="UTF-8" /> 
        <title>Login</title>
      <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    form {
      background: #111;
      padding: 2em;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 1em;
      width: 300px;
    }
    input {
      padding: 0.6em;
      border: none;
      border-radius: 4px;
      background: #000;
      color: #fff;
      border: 1px solid #555;
    }
    button {
      padding: 0.6em;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #000;
      color: #fff;
      border: 1px solid #fff;
    }
    .back-btn { 
    position: absolute;
    top: 15px; 
    left: 15px;
    text-decoration: none; 
    color: #fff; 
    font-size: 1.4rem;
    padding: 6px 10px;
    }
    .title { 
    position: absolute; 
    top: 40px; 
    font-size: 2.2rem; 
    font-weight: bold; 
    letter-spacing: 3px; 
    }
  </style>
</head>
<body>
    <a href="Página_Principal.html" class="back-btn">←</a>
    <div class="title">SHOESCOOL</div>
    <form>
    <h2>Iniciar sesión</h2>
    <input type="email" placeholder="Correo" required />
    <input type="password" placeholder="Contraseña" required />
    <button type="submit">Entrar</button>
  </form>
</body>
